# This is a placeholder for the Cloudflare tunnel SealedSecret
# Generate this using the command below:
#
# 1. Get your tunnel token from Cloudflare Dashboard:
#    - Go to https://one.dash.cloudflare.com/
#    - Navigate to Networks → Tunnels
#    - Create or select your tunnel
#    - Copy the tunnel token
#
# 2. Create and seal the secret:
#    kubectl create secret generic cloudflare-tunnel-token \
#      --namespace=cloudflared \
#      --from-literal=token="YOUR_TUNNEL_TOKEN" \
#      --dry-run=client \
#      -o yaml | \
#    kubeseal \
#      --controller-name=sealed-secrets \
#      --controller-namespace=sealed-secrets \
#      --format=yaml \
#      > manifests/cloudflared/cloudflare-sealed-secret.yaml
#
# 3. Store the token securely in your password manager
# 4. Commit the generated SealedSecret to Git
#
# For detailed instructions, see: docs/secret-management-guide.md

# For now, using a regular secret (MUST be replaced with SealedSecret in production)
apiVersion: v1
kind: Secret
metadata:
  namespace: cloudflared
  name: cloudflare-tunnel-token
type: Opaque
stringData:
  token: replace-with-your-cloudflare-tunnel-token
