# BitwardenSecret for Cloudflare Tunnel
# Syncs Cloudflare tunnel token from Bitwarden Secrets Manager
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: cloudflare-tunnel-token
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  # Organization ID from Bitwarden
  organizationId: "9c14df47-6ef1-4a35-9381-aedf0113ef9d"

  # Reference to the operator's access token secret
  authToken:
    secretName: bw-auth-token
    secretKey: token

  # Name of the Kubernetes secret to create/update
  secretName: cloudflare-tunnel-token

  # Map Bitwarden secret to Kubernetes secret key
  map:
    - bwSecretId: "41c51d59-4bde-482c-a096-b3ba0080d653"
      secretKeyName: token
