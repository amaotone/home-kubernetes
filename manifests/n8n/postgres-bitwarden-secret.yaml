# BitwardenSecret for PostgreSQL
# Syncs all PostgreSQL configuration from Bitwarden Secrets Manager
#
# Required Bitwarden secrets:
# - postgres-user (value: "postgres")
# - postgres-db (value: "n8n")
# - postgres-non-root-user (value: "n8n")
# - postgres-password (generated password)
# - postgres-non-root-password (generated password)
#
# To complete setup:
# 1. Create the following secrets in Bitwarden Secrets Manager:
#    - postgres-user = postgres
#    - postgres-db = n8n
#    - postgres-non-root-user = n8n
# 2. Get the Secret IDs from Bitwarden Web UI
# 3. Add them to the map below
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: postgres-secret
  namespace: n8n
  labels:
    app: postgres
spec:
  organizationId: "9c14df47-6ef1-4a35-9381-aedf0113ef9d"

  authToken:
    secretName: bw-auth-token
    secretKey: token

  secretName: postgres-secret

  map:
    - bwSecretId: "b71ee515-ec90-4f15-8203-b3ba00878037"
      secretKeyName: POSTGRES_USER

    - bwSecretId: "f1214fd7-3a2e-48e8-a7dd-b3ba00879474"
      secretKeyName: POSTGRES_DB

    - bwSecretId: "bf86e8dd-28be-4d0f-8b06-b3ba0087a48b"
      secretKeyName: POSTGRES_NON_ROOT_USER

    - bwSecretId: "30b7f4c0-adce-4030-ad50-b3ba007e952c"
      secretKeyName: POSTGRES_PASSWORD

    - bwSecretId: "d1006aa1-4427-4729-8c2f-b3ba007ee093"
      secretKeyName: POSTGRES_NON_ROOT_PASSWORD
