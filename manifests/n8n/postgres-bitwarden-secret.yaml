# Static configuration values for PostgreSQL
# These are non-sensitive configuration values that don't change
apiVersion: v1
kind: Secret
metadata:
  name: postgres-config
  namespace: n8n
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "n8n"
  POSTGRES_NON_ROOT_USER: "n8n"
---
# BitwardenSecret for PostgreSQL passwords
# Syncs sensitive password values from Bitwarden Secrets Manager
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: postgres-passwords
  namespace: n8n
  labels:
    app: postgres
spec:
  organizationId: "9c14df47-6ef1-4a35-9381-aedf0113ef9d"

  authToken:
    secretName: bw-auth-token
    secretNamespace: sm-operator-system

  secretName: postgres-secret

  map:
    - bwSecretId: "30b7f4c0-adce-4030-ad50-b3ba007e952c"
      secretKeyName: POSTGRES_PASSWORD

    - bwSecretId: "d1006aa1-4427-4729-8c2f-b3ba007ee093"
      secretKeyName: POSTGRES_NON_ROOT_PASSWORD
