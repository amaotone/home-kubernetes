apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bitwarden-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # Deploy before applications that use secrets
spec:
  project: default
  source:
    repoURL: https://charts.bitwarden.com/
    chart: sm-operator
    targetRevision: 1.1.0
    helm:
      valuesObject:
        # IMPORTANT: Replace with your actual organization ID from Bitwarden
        # Get it from: Bitwarden Web Vault → Organization Settings → Organization ID
        organizationId: "9c14df47-6ef1-4a35-9381-aedf0113ef9d"

        # Sync interval in seconds (minimum: 180)
        # Lower values = more frequent sync, but more API calls
        syncInterval: 300

        # Cloud region: US or EU
        cloudRegion: "US"

        # For self-hosted Bitwarden (uncomment and configure if needed)
        # apiUrl: "https://your-bitwarden-server.com/api"
        # identityUrl: "https://your-bitwarden-server.com/identity"

        # Resource limits for operator pod
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi

        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

        # Pod security context
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault

  destination:
    server: https://kubernetes.default.svc
    namespace: sm-operator-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health checks
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas  # Ignore replica count differences
